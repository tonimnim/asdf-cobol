name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck --severity=warning -x bin/* lib/*.bash

  list-all:
    name: list-all reaches mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify list-all returns versions
        run: |
          chmod +x bin/* lib/*.bash || true
          output=$(bin/list-all)
          if [ -z "$output" ]; then
            echo "list-all returned empty output" >&2
            exit 1
          fi
          echo "$output" | tr ' ' '\n' | head

  plugin-test:
    name: asdf plugin test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev libdb-dev \
            libncurses-dev libxml2-dev
      - uses: asdf-vm/actions/plugin-test@v3
        with:
          command: cobc --version
          version: 3.2
          asdf_branch: v0.14.1
